<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      display: grid;
      place-items: center;
      height: 100vh;
      color: #0f172a;
    }
    .box {
      background: white;
      padding: 40px 60px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Hello!</h1>
    <p>Welcome to my website.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
